<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Room | Favoje Battle</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">FB</div>
          <div>
            <div class="eyebrow">FUTMINNA</div>
            <h1>Favoje Battle</h1>
          </div>
        </div>
        <nav class="topnav" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="battle.html" class="nav-link">1v1</a>
          <a href="battle-rush.html" class="nav-link">Rush</a>
          <a href="tournaments.html" class="nav-link">Tournaments</a>
        </nav>
      </header>

      <main class="page-shell narrow-shell">
        <section class="panel">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Private challenge</span>
              <h2>Room lobby</h2>
            </div>
          </div>

          <div class="room-card">
            <div class="room-code-box">
              <span>Room ID</span>
              <strong>FB-71842</strong>
            </div>
            <div class="form-row">
              <button type="button" class="primary-button">Copy invite</button>
              <button type="button" class="secondary-button">Start battle</button>
            </div>
          </div>

          <div class="panel-sm">
            <h3>Participants</h3>
            <ul class="player-list">
              <li><span>@You</span><span>Host</span></li>
              <li><span>@MusaT</span><span>Ready</span></li>
              <li><span>@AishaS</span><span>Ready</span></li>
            </ul>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
