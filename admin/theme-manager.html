<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Manager | Favoje Battle</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">FB</div>
          <div>
            <div class="eyebrow">FUTMINNA</div>
            <h1>Favoje Battle</h1>
          </div>
        </div>
        <nav class="topnav" aria-label="Main navigation">
          <a href="../dashboard.html" class="nav-link">Dashboard</a>
          <a href="overview.html" class="nav-link">Admin</a>
          <a href="theme-manager.html" class="nav-link active">Themes</a>
        </nav>
      </header>

      <main class="page-shell">
        <section class="panel">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Theme system</span>
              <h2>Theme Manager</h2>
            </div>
          </div>

          <div class="theme-gallery">
            <button type="button" class="theme-swatch active" data-theme="royal-purple" data-appearance="dark">Royal Purple</button>
            <button type="button" class="theme-swatch" data-theme="ember-red" data-appearance="dark">Ember Red</button>
            <button type="button" class="theme-swatch" data-theme="cyber-cyan" data-appearance="dark">Cyber Cyan</button>
            <button type="button" class="theme-swatch" data-theme="emerald" data-appearance="dark">Emerald</button>
            <button type="button" class="theme-swatch" data-theme="neon-orchid" data-appearance="dark">Neon Orchid</button>
            <button type="button" class="theme-swatch" data-theme="golden-crown" data-appearance="dark">Golden Crown</button>
            <button type="button" class="theme-swatch" data-theme="ocean-blue" data-appearance="dark">Ocean Blue</button>
            <button type="button" class="theme-swatch" data-theme="rose-quartz" data-appearance="dark">Rose Quartz</button>
            <button type="button" class="theme-swatch" data-theme="titanium" data-appearance="dark">Titanium</button>
            <button type="button" class="theme-swatch" data-theme="toxic-lime" data-appearance="dark">Toxic Lime</button>
            <button type="button" class="theme-swatch" data-theme="arctic-mint" data-appearance="dark">Arctic Mint</button>
            <button type="button" class="theme-swatch" data-theme="obsidian-bronze" data-appearance="dark">Obsidian Bronze</button>
            <button type="button" class="theme-swatch" data-theme="dark-ash" data-appearance="dark">Dark Ash</button>
            <button type="button" class="theme-swatch" data-theme="dark-brown" data-appearance="dark">Dark Brown</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
