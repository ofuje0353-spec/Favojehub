<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Overview | Favoje Battle</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">FB</div>
          <div>
            <div class="eyebrow">FUTMINNA</div>
            <h1>Favoje Battle</h1>
          </div>
        </div>
        <nav class="topnav" aria-label="Main navigation">
          <a href="../dashboard.html" class="nav-link">Dashboard</a>
          <a href="overview.html" class="nav-link active">Admin</a>
          <a href="theme-manager.html" class="nav-link">Themes</a>
        </nav>
      </header>

      <main class="page-shell">
        <section class="panel">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Administration</span>
              <h2>Control centre</h2>
            </div>
          </div>

          <div class="stats-grid four-up">
            <article class="stat-card">
              <span class="eyebrow">Approved</span>
              <strong>1480</strong>
              <small>Verified players</small>
            </article>
            <article class="stat-card">
              <span class="eyebrow">Pending</span>
              <strong>92</strong>
              <small>Awaiting review</small>
            </article>
            <article class="stat-card">
              <span class="eyebrow">Active matches</span>
              <strong>18</strong>
              <small>Across all modes</small>
            </article>
            <article class="stat-card">
              <span class="eyebrow">Open reports</span>
              <strong>6</strong>
              <small>Voice and match moderation</small>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
