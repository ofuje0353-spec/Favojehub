<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Favoje Battle</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">FB</div>
          <div>
            <div class="eyebrow">FUTMINNA</div>
            <h1>Favoje Battle</h1>
          </div>
        </div>
        <nav class="topnav" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="leaderboard.html" class="nav-link">Leaderboard</a>
          <a href="profile.html" class="nav-link active">Profile</a>
          <a href="settings.html" class="nav-link">Settings</a>
        </nav>
      </header>

      <main class="page-shell">
        <section class="panel profile-panel">
          <div class="profile-header">
            <div class="avatar-large">AS</div>
            <div>
              <span class="eyebrow">@AishaS</span>
              <h2>Aisha Sule</h2>
              <p>Computer Science • 300 Level</p>
            </div>
            <button type="button" class="primary-button">Edit profile</button>
          </div>

          <div class="stats-grid four-up">
            <article class="stat-card">
              <span class="eyebrow">XP</span>
              <strong>4820</strong>
            </article>
            <article class="stat-card">
              <span class="eyebrow">Level</span>
              <strong>18</strong>
            </article>
            <article class="stat-card">
              <span class="eyebrow">Accuracy</span>
              <strong>94%</strong>
            </article>
            <article class="stat-card">
              <span class="eyebrow">Wins</span>
              <strong>52</strong>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
