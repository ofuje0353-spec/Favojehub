<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History | Favoje Battle</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">FB</div>
          <div>
            <div class="eyebrow">FUTMINNA</div>
            <h1>Favoje Battle</h1>
          </div>
        </div>
        <nav class="topnav" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="history.html" class="nav-link active">History</a>
          <a href="profile.html" class="nav-link">Profile</a>
          <a href="settings.html" class="nav-link">Settings</a>
        </nav>
      </header>

      <main class="page-shell">
        <section class="panel">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Records</span>
              <h2>Match history</h2>
            </div>
          </div>
          <div class="history-list">
            <div class="history-item">
              <strong>1v1 Battle</strong>
              <span>Win vs @DanielB</span>
              <small>2 Oct 2026 • +120 XP</small>
            </div>
            <div class="history-item">
              <strong>Battle Rush</strong>
              <span>3rd place • Survival stage</span>
              <small>29 Sep 2026 • +80 XP</small>
            </div>
            <div class="history-item">
              <strong>Tournament</strong>
              <span>Quarter-final advancement</span>
              <small>22 Sep 2026 • +40 XP</small>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
